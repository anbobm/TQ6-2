<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile Card</title>
</head>
<style>
    body {
        text-align: center;
        background-color:lightcyan;
        font-family: Arial, sans-serif;
    }

    .card {
        width: 350px;
        margin: 50px auto;
        padding: 40px 60px;
        border: 2px solid #b0b0b0;
        border-radius: 15px;
        background-color: #f1f1f1;
    }

    img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
    }

    ul {
        list-style-position: inside;
        padding: 0;
    }

    button {
        border-radius: 8px;
        padding: 10px 20px;
        font-size: 16px;
        background-color: #2baeae;
        color: #f1f1f1;
    }

    h1, h3 {
        color: #350094;
    }

    h2 {
        color: #6d6d6d;
    }
</style>
<body>

    <div class="card">
        <img src="hamster.jpeg">

        <h1>Max Mustermann</h1>

        <h2>Future Software Developer</h2>

        Hello, my name is Max. Hello, my name is Max. Hello, my name is Max. Hello, my name is Max. Hello, my name is Max. Hello, my name is Max. 

        <h3>Hobbies</h3>

        <ul>
            <li>Gaming</li>
            <li>Reading</li>
            <li>Hiking</li>
        </ul>

        <p><strong>Favorite Language:</strong> C#</p>

        <button>Contact Me</button>
    </div>

</body>
</html>
