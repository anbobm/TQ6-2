<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Aufgabe 110 – Anmeldeformular</title>
  </head>

  <body>
    <h1>Anmeldeformular für ein Freizeitcamp</h1>

    <form>
      <p>
        <label>
          Vorname:
          <input type="text" name="vorname">
        </label>
      </p>

      <p>
        <label>
          Nachname:
          <input type="text" name="nachname">
        </label>
      </p>

      <p>
  <label>
    Email-Adresse:
    <input type="email" name="email">
  </label>
</p>

            <p>
        <label>
          Passwort:
          <input type="password" name="passwort">
        </label>
      </p>

            <p>
        <label>
          Geburtsdatum:
          <input type="date" name="geburtsdatum">
        </label>
      </p>


         <p>
        <label>
          Telefonnummer:
          <input type="tel" name="telefonnummer">
        </label>
      </p>

            <p>
        <label>
          Lieblingsfarbe:
          <input type="color" name="lieblingsfarbe">
        </label>
      </p>

            <p>
        <label>
          Tischtennis-Skill:
          <input type="range" name="tischtennis_skill" min="1" max="10">
        </label>
      </p>




         


           <p>
        Lieblingsaktivität:

        <label>
          <input type="radio" name="lieblingsaktivitaet" value="schwimmen">
          Schwimmen
        </label>

        <label>
          <input type="radio" name="lieblingsaktivitaet" value="wandern">
          Wandern
        </label>

        <label>
          <input type="radio" name="lieblingsaktivitaet" value="tischtennis">
          Tischtennis
        </label>
      </p>



            <p>
        Mahlzeiten:

        <label>
          <input type="checkbox" name="mahlzeiten" value="fruehstueck">
          Frühstück
        </label>

        <label>
          <input type="checkbox" name="mahlzeiten" value="mittagessen">
          Mittagessen
        </label>

        <label>
          <input type="checkbox" name="mahlzeiten" value="abendessen">
          Abendessen
        </label>
      </p>
      
    </form>
  </body>
</html>
