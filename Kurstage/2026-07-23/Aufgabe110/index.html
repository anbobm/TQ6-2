<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmeldung Freizeitcamp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>



    <body>
    <main class="container py-5">
        <h1 class="text-center mb-4">Anmeldung Freizeitcamp</h1>

<form class="mx-auto p-4 border rounded shadow-sm bg-light"
      style="max-width: 600px;">

    
        <div class="mb-3">
    <label for="vorname" class="form-label">Vorname:</label>
    <input type="text"
           class="form-control"
           id="vorname"
           name="vorname">
</div>
        <div class="mb-3">
    <label for="nachname" class="form-label">Nachname:</label>
    <input type="text"
           class="form-control"
           id="nachname"
           name="nachname">
</div>
        <div class="mb-3">
    <label for="email" class="form-label">E-Mail-Adresse:</label>
    <input type="email"
           class="form-control"
           id="email"
           name="email">
</div>
       <div class="mb-3">
    <label for="passwort" class="form-label">Passwort:</label>
    <input type="password"
           class="form-control"
           id="passwort"
<div class="mb-3">
    <label for="telefonnummer" class="form-label">Telefonnummer:</label>

    <div class="input-group">
        <select class="form-select"
                id="laendervorwahl"
                name="laendervorwahl"
                aria-label="Ländervorwahl"
                style="max-width: 190px;">
            <option value="+49">Deutschland +49</option>
            <option value="+43">Österreich +43</option>
            <option value="+41">Schweiz +41</option>
            <option value="+380">Ukraine +380</option>
        </select>

        <input type="tel"
               class="form-control"
               id="telefonnummer"
               name="telefonnummer"
               placeholder="Telefonnummer">
    </div>
</div>
        <div class="mb-3">
    <label for="geburtsdatum" class="form-label">Geburtsdatum:</label>
    <input type="date"
           class="form-control"
           id="geburtsdatum"
           name="geburtsdatum">
</div>


        <div class="mb-3">
    <label for="lieblingsfarbe" class="form-label">Lieblingsfarbe:</label>
    <input type="color"
           class="form-control form-control-color"
           id="lieblingsfarbe"
           name="lieblingsfarbe"
           title="Wähle deine Lieblingsfarbe">
</div>
        <div class="mb-3">
    <label for="tischtennisskill" class="form-label">
        Tischtennis-Skill: 1 bis 10
    </label>

    <input type="range"
           class="form-range"
           id="tischtennisskill"
           name="tischtennisskill"
           min="1"
           max="10">
</div>
        <div class="mb-3">
    <label for="lieblingsaktivitaet" class="form-label">
        Lieblingsaktivität:
    </label>

    <select class="form-select"
            id="lieblingsaktivitaet"
            name="lieblingsaktivitaet">
        <option value="wandern">Wandern</option>
        <option value="tischtennis">Tischtennis</option>
        <option value="lagerfeuer">Lagerfeuer</option>
        <option value="gesellschaftsspiele">Gesellschaftsspiele</option>
    </select>
</div>
        <fieldset class="mb-3">
    <legend class="col-form-label pt-0">Mahlzeiten:</legend>

    <div class="form-check">
        <input class="form-check-input"
               type="checkbox"
               id="fruehstueck"
               name="fruehstueck">

        <label class="form-check-label" for="fruehstueck">
            Frühstück
        </label>
    </div>

    <div class="form-check">
        <input class="form-check-input"
               type="checkbox"
               id="mittagessen"
               name="mittagessen">

        <label class="form-check-label" for="mittagessen">
            Mittagessen
        </label>
    </div>

    <div class="form-check">
        <input class="form-check-input"
               type="checkbox"
               id="abendessen"
               name="abendessen">

        <label class="form-check-label" for="abendessen">
            Abendessen
        </label>
    </div>
</fieldset>
        <button type="submit" class="btn btn-primary w-100">
    Anmeldung abschicken
</button>
    </form>

    </main>

</body>



</html>
