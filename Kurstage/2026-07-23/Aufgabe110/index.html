<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <title>Anmeldung Freizeitcamp</title>
  </head>

  <body>
    <h1>Anmeldung</h1>

    <form>
      <p>
        <label>
          Vorname:
          <input type="text" name="vorname">
        </label>
      </p>

      <p>
        <label>
          Nachname:
          <input type="text" name="nachname">
        </label>
      </p>

      <p>
        <label>
          Email:
          <input type="email" name="email">
        </label>
      </p>

      <p>
        <label>
          Passwort:
          <input type="password" name="passwort">
        </label>
      </p>

      <p>
        <label>
          Telefonnummer:
          <input type="tel" name="telefonnummer">
        </label>
      </p>

      <p>
        <label>
          Lieblingsfarbe:
          <input type="color" name="lieblingsfarbe">
        </label>
      </p>

      <p>
        <label>
          Tischtennis-Skill:
          <input type="range" name="tischtennis_skill" min="1" max="10">
        </label>
      </p>

      <p>
        <label>
          Lieblingsaktivität:
          <select name="lieblingsaktivitaet">
            <option value="wandern">Wandern</option>
            <option value="tischtennis">Tischtennis</option>
            <option value="lagerfeuer">Lagerfeuer</option>
            <option value="gesellschaftsspiele">Gesellschaftsspiele</option>
          </select>
        </label>
      </p>

      <p>
        <label>
          Frühstück:
          <input type="checkbox" name="fruehstueck">
        </label>
      </p>

      <p>
        <label>
          Mittagessen:
          <input type="checkbox" name="mittagessen">
        </label>
      </p>

      <p>
        <label>
          Abendessen:
          <input type="checkbox" name="abendessen">
        </label>
      </p>

      <p>
        <input type="submit" value="Abschicken">
      </p>
    </form>
  </body>
</html>
