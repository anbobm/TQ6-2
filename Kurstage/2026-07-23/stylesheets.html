<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stylesheets</title>
    <style>
        h1, p {
            color:#ff0000;
        }
        .greenParagraphs {
            color:green;
        }
        #specificParagraph {
            color:blue;
        }
    </style>
</head>
<body>
    <h1>Dies ist eine Überschrift</h1>
    <p>Dies ist ein Absatz</p>
    <p class="greenParagraphs">Dies ist ein Absatz.</p>
    <p class="greenParagraphs">Dies ist ein Absatz.</p>
    <p id="specificParagraph">Dies ist ein Absatz</p>
</body>
</html>
