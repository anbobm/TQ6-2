<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulare</title>
</head>
<body>

            Name: <input type="text" value="Paul" name="name">
        </label>
        <label>
            Alter: <input type="text" value="33" name="alter">
        </label>
        <label>TQ:

                <option value="1">TQ1</option>
                <option value="2">TQ2</option>
                <option value="3">TQ3</option>

                <option value="5">TQ5</option>

        <label>
            Englisch:
            <input type="checkbox" name="englisch">
        </label>
        <input type="submit" value="Abschicken">
    </form>
</body>
</html>
