<!DOCTYPE html>
<html lang="en">

    <title>Tabellen</title>
</head>
<body>

    <h2>Städte, die ich schonmal besucht habe</h2>

    <table>

            <th>Stadt</th>
            <th>Datum</th>

            <td>Berlin</td>

        </tr>
        <tr>
            <td>Prag</td>

        </tr>
        <tr>
            <td>Hamburg</td>
            <td>21.07.2026</td>
        </tr>
    </table>
</body>
</html>
