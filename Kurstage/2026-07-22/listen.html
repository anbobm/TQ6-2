<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Listen</title>
</head>
<body>
    <h1>Listen</h1>

    <h2>Unsortierte Listen (unordered lists)</h2>

    <ul>
        <li>Berlin</li>
        <li>Prag</li>
        <li>Hamburg</li>
    </ul>

    <h2>Sortierten Listen (order lists)</h2>

    <ol>
        <li>Butter in Pfanne schmelzen lassen</li>
        <li>Pfannkuchenteig in Pfanne rinkloppen</li>
        <li>Teig braten bis leicht braun</li>
        <li>Teig wenden</li>
    </ol>

</body>
</html>
